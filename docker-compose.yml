services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: substation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-substation}
      POSTGRES_DB: substationiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substation -d substationiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  backend:
    build: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://substation:${POSTGRES_PASSWORD:-substation}@postgres:5432/substationiq
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=substationiq
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PATH=/app/data/chroma
      - FRONTEND_URL=http://localhost:5173
      - CORS_ALLOW_ORIGINS=http://localhost:5173,https://*.vercel.app
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_LOGIN=5/minute
      - RATE_LIMIT_CHAT=30/minute
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/app/data
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://substation:${POSTGRES_PASSWORD:-substation}@postgres:5432/substationiq
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=substationiq
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PATH=/app/data/chroma
    depends_on:
      - backend
      - redis
    command: arq app.worker.WorkerSettings

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  mongodata:
  redisdata:
  chroma-data: