version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: substationai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: substationai
      POSTGRES_PASSWORD: substationai_secret
      POSTGRES_DB: substationai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substationai -d substationai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

