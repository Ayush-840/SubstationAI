databases:
- databaseName: substationiq
  name: substationiq-db
  plan: free
  user: substation
services:
- dockerContext: .
  dockerfilePath: ./Dockerfile
  envVars:
  - key: APP_ENV
    value: production
  - generateValue: true
    key: JWT_SECRET
  - key: JWT_ALGORITHM
    value: HS256
  - key: JWT_EXPIRE_MINUTES
    value: '15'
  - key: REFRESH_EXPIRE_DAYS
    value: '7'
  - key: REFRESH_REUSE_GRACE_SECONDS
    value: '10'
  - key: SEED_DEMO_USERS
    value: 'true'
  - key: LOGIN_MAX_FAILURES
    value: '5'
  - key: LOGIN_LOCKOUT_SECONDS
    value: '900'
  - key: RATE_LIMIT_LOGIN
    value: 30/minute
  - key: RATE_LIMIT_REGISTER
    value: 30/hour
  - key: RATE_LIMIT_CHAT
    value: 30/minute
  - key: TOTP_ENCRYPTION_KEY
    sync: false
  - key: GOOGLE_CLIENT_ID
    sync: false
  - key: FRONTEND_URL
    value: https://frontend-h8ikkpyfy-ayush-840s-projects.vercel.app
  - key: CORS_ALLOW_ORIGINS
    value: https://frontend-h8ikkpyfy-ayush-840s-projects.vercel.app
  - key: CORS_ALLOW_ORIGIN_REGEX
    value: https://frontend-[a-z0-9-]*ayush-840s-projects\.vercel\.app
  - fromDatabase:
      name: substationiq-db
      property: connectionString
    key: DATABASE_URL
  - fromService:
      name: substationiq-redis
      property: connectionString
      type: keyvalue
    key: REDIS_URL
  - key: MONGO_URL
    sync: false
  - key: MONGO_DB
    value: substationiq
  - key: LLM_PROVIDER
    value: gemini
  - key: GEMINI_API_KEY
    sync: false
  - key: GROQ_API_KEY
    sync: false
  - key: EMBED_MODEL
    value: BAAI/bge-small-en-v1.5
  - key: CHROMA_PATH
    value: /tmp/chroma
  - key: CONFIDENCE_THRESHOLD
    value: '0.35'
  - key: TOP_K_VECTOR
    value: '20'
  - key: TOP_K_BM25
    value: '20'
  - key: TOP_K_RERANK
    value: '6'
  - key: MAX_UPLOAD_MB
    value: '25'
  - key: LOG_LEVEL
    value: INFO
  healthCheckPath: /health
  name: substationiq-api
  plan: free
  runtime: docker
  type: web
- ipAllowList: []
  maxmemoryPolicy: allkeys-lru
  name: substationiq-redis
  plan: free
  type: keyvalue
