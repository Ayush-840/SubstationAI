services:
  - type: web
    name: substationiq-api
    runtime: docker
    plan: free
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: CHROMA_PATH
        value: /app/data/chroma
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: TOP_K_VECTOR
        value: "20"
      - key: TOP_K_BM25
        value: "20"
      - key: TOP_K_RERANK
        value: "6"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: MONGO_URL
        value: ""
      - key: MONGO_DB
        value: substationiq
      - key: FRONTEND_URL
        value: https://frontend-h8ikkpyfy-ayush-840s-projects.vercel.app

