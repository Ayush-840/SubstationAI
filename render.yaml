# Render Blueprint — API (Docker), managed Postgres, Key Value (Redis).
# Field names checked against https://render.com/docs/yaml-spec
#
# Free-tier facts that shape this file:
#   * the web service sleeps after ~15 min idle (first request takes ~30-60 s);
#   * no persistent disk on free web services; accounts live in Postgres, never on disk;
#     the default image is the slim one (INSTALL_HEAVY=false), see Dockerfile;
#   * free Postgres is time-limited by Render; upgrade or re-create before a demo/viva.

services:
  - type: web
    name: substationiq-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # --- security / auth (see AUTH_TRD.md) ---
      - key: APP_ENV
        value: production            # enables startup safety checks (strong secret, CORS set, no demo users)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "15"                  # short-lived access token; the refresh token keeps users signed in
      - key: REFRESH_EXPIRE_DAYS
        value: "7"
      - key: REFRESH_REUSE_GRACE_SECONDS
        value: "10"
      - key: SEED_DEMO_USERS
        value: "false"               # never ship public demo/admin passwords
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_LOCKOUT_SECONDS
        value: "900"
      - key: RATE_LIMIT_LOGIN
        value: 30/minute
      - key: RATE_LIMIT_REGISTER
        value: 30/hour
      - key: RATE_LIMIT_CHAT
        value: 30/minute
      # Fernet key for at-rest TOTP secrets — generate once with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Production refuses to start without it (AUTH_TRD Day 7).
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      # Google Sign-In (optional): OAuth client id from Google Cloud Console.
      # The public id also goes to Vercel as VITE_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # --- CORS: set these to YOUR Vercel URLs ---
      - key: FRONTEND_URL
        value: https://frontend-h8ikkpyfy-ayush-840s-projects.vercel.app
      - key: CORS_ALLOW_ORIGINS
        value: https://frontend-h8ikkpyfy-ayush-840s-projects.vercel.app
      - key: CORS_ALLOW_ORIGIN_REGEX
        # this team's Vercel preview/alias URLs only -- NOT every *.vercel.app site
        value: 'https://frontend-[a-z0-9-]*ayush-840s-projects\.vercel\.app'

      # --- data stores ---
      - key: DATABASE_URL
        fromDatabase:
          name: substationiq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: substationiq-redis
          property: connectionString
      - key: MONGO_URL
        sync: false                  # paste your MongoDB Atlas URI in the dashboard
      - key: MONGO_DB
        value: substationiq

      # --- LLM ---
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5

      # --- retrieval / upload ---
      - key: CHROMA_PATH
        value: /tmp/chroma           # only used by the INSTALL_HEAVY image
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: TOP_K_VECTOR
        value: "20"
      - key: TOP_K_BM25
        value: "20"
      - key: TOP_K_RERANK
        value: "6"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: LOG_LEVEL
        value: INFO

  - type: keyvalue
    name: substationiq-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                  # internal connections only

databases:
  - name: substationiq-db
    databaseName: substationiq
    user: substation
    plan: free
